name: WorkHours
options:
  bundleIdPrefix: cn.gongshijilu
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGN_IDENTITY: ""
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"

targets:
  WorkHours:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: WorkHours
        excludes:
          - "Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cn.gongshijilu.jxt.swiftui
        PRODUCT_NAME: WorkHours
        INFOPLIST_FILE: WorkHours/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        MARKETING_VERSION: "1.3.2"
        CURRENT_PROJECT_VERSION: "9"
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_STRICT_CONCURRENCY: minimal
        SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: "NO"

  WorkHoursTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: WorkHoursTests
    dependencies:
      - target: WorkHours
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cn.gongshijilu.jxt.swiftui.tests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/WorkHours.app/WorkHours"
        BUNDLE_LOADER: "$(TEST_HOST)"
        SWIFT_STRICT_CONCURRENCY: minimal

schemes:
  WorkHours:
    build:
      targets:
        WorkHours: all
        WorkHoursTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - WorkHoursTests
    archive:
      config: Release
